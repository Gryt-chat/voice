name: Release

# Dispatched, not automatic. @gryt/ui publishes through changesets on every push
# to main, which suits a package with a changeset per PR; this one has no
# changesets, one maintainer, and a consumer that pins a version deliberately.
# So it works the way Release Client and Release Server already do — you pick it
# when you mean it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version argument: patch, minor, major, or an exact version like 0.1.0'
        required: true
        default: patch
      tag:
        description: 'npm dist-tag'
        required: true
        default: latest
        type: choice
        options: [latest, beta, next]

permissions:
  contents: write
  # Trusted publishing. There is no NPM_TOKEN in this repo and there should not
  # be one — npm mints a short-lived credential from this token instead.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm 11.5.1 or newer, which is ahead of what the
      # Node 24 image ships.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # GRYT-344 shipped a package tsc was happy with and Node could not load at
      # all — every relative import in dist was extensionless, which only a
      # bundler tolerates. It was caught by someone trying it by hand, so that
      # attempt is a step now. This runs against the real dist, before anything
      # is published.
      - name: Check the built package actually imports
        run: |
          node --input-type=module -e "
            const m = await import('./dist/index.js');
            const expected = ['useSFU', 'useMicrophone', 'useCamera', 'VoiceConfigProvider', 'setVoiceHost'];
            const missing = expected.filter((name) => !(name in m));
            if (missing.length) {
              throw new Error('Built package is missing exports: ' + missing.join(', '));
            }
            console.log('dist/index.js imports cleanly, ' + Object.keys(m).length + ' exports');
          "

      - name: Set the version
        id: version
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish --provenance --access public --tag "${{ inputs.tag }}"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main --follow-tags

      - name: Summary
        run: |
          echo "Published @gryt/voice@${{ steps.version.outputs.version }} to the ${{ inputs.tag }} tag." >> "$GITHUB_STEP_SUMMARY"
